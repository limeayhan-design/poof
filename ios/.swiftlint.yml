disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_name
  - todo
  - force_cast
  - force_try
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting
  - implicit_optional_initialization
  - multiple_closures_with_trailing_closure
  - opening_brace
  - switch_case_alignment
  - large_tuple

analyzer_rules:
  - unused_import

opt_in_rules:
  - empty_count
  - closure_spacing

excluded:
  - Pods
  - build
  - DerivedData
  - .build

reporter: "xcode"
